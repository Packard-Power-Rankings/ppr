name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      # Create the development environment file from GitHub Secrets.
      - name: Create development environment file
        run: |
          mkdir -p .env
          echo "MONGO_DB_NAME=${{ secrets.MONGO_DB_NAME }}" >> .env/development
          echo "MONGO_USER=${{ secrets.MONGO_USER }}" >> .env/development
          echo "MONGO_PASS=${{ secrets.MONGO_PASS }}" >> .env/development
          echo "MONGO_PORT=${{ secrets.MONGO_PORT }}" >> .env/development
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env/development

      # Run Docker Compose with the development environment file.
      - name: Build and Test
        run: |
          docker-compose --env-file .env/development up --build -d
          # Additional test or build commands here
