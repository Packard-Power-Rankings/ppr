services:
  db:
    image: mongo:8.3
    volumes:
      - ./data/db:/data/db
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    networks:
      - app-network
    env_file:
      - .env/development
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost
          --username "$$MONGO_INITDB_ROOT_USERNAME"
          --password "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements-dev.txt
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./tests/backend:/app/tests:ro
      - archive_data:/var/lib/ppr-archives
      - ./uploads:/var/lib/ppr-uploads
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - app-network
    environment:
      - PYTHONPATH=/app
      - APP_ENV=development
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@db:27017/${MONGO_DB_NAME}?authSource=admin
      - MONGO_MAX_POOL_SIZE=${MONGO_MAX_POOL_SIZE:-50}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SETUP_TOKEN=${SETUP_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - ARCHIVE_DIR=/var/lib/ppr-archives
      - UPLOAD_DIR=/var/lib/ppr-uploads
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file:
      - .env/development
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s

  arq_worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS_FILE: requirements-dev.txt
    command:
      - watchfiles
      - --filter
      - python
      - --target-type
      - command
      - arq api.service.tasks.WorkerSettings
      - /app/api
    volumes:
      - ./backend:/app
    working_dir: /app
    networks:
      - app-network
    environment:
      - PYTHONPATH=/app
      - APP_ENV=development
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASS}@db:27017/${MONGO_DB_NAME}?authSource=admin
      - MONGO_MAX_POOL_SIZE=${MONGO_MAX_POOL_SIZE:-50}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    env_file:
      - .env/development

  redis:
    image: redis:8-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    networks:
      - app-network
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    command: ["sh", "./docker-entrypoint.dev.sh"]
    volumes:
      - ./frontend:/app
      - ./tests/frontend:/app/tests:ro
      - /app/node_modules
      - archive_data:/app/public/archive:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000').then(response =>
          process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 20s

volumes:
  archive_data:
  redis_data:

networks:
  app-network:
    driver: bridge
